# The snap: built from source by snapcraft on core24 under strict confinement,
# on the GNOME extension's runtime. `snapcraft pack` builds it (in LXD, or with
# --destructive-mode on an Ubuntu 24.04 host). Registering the name, uploading
# and releasing are the maintainer's (docs/releasing.md).
name: webspace-app
title: WebSpace
base: core24
adopt-info: webspace
grade: stable
confinement: strict

platforms:
  amd64:

# WebKit compiles in where its helper processes, injected bundle and inspector
# resources live (PKGLIBEXECDIR, PKGLIBDIR, PKGDATADIR), and a release build
# reads its helpers from there alone. Built for /usr, these bind the snap's
# copies over those paths, as the GNOME extension does for WebKitGTK.
layout:
  /usr/libexec/wpe-webkit-2.0:
    bind: $SNAP/usr/libexec/wpe-webkit-2.0
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wpe-webkit-2.0:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wpe-webkit-2.0
  /usr/share/wpe-webkit-2.0:
    bind: $SNAP/usr/share/wpe-webkit-2.0

slots:
  # GApplication's one instance owns the application ID on the session bus
  # (PLATFORM-011).
  webspace-instance:
    interface: dbus
    bus: session
    name: org.codeberg.theoden8.webspace

apps:
  webspace-app:
    command: opt/webspace/webspace_app
    desktop: usr/share/applications/org.codeberg.theoden8.webspace.desktop
    common-id: org.codeberg.theoden8.webspace
    extensions: [gnome]
    environment:
      # libWPEWebKit and libwpe, for the app and for WebKit's helper
      # processes, which inherit it.
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    # The GNOME extension adds desktop (portals, notifications), desktop-legacy,
    # gsettings, opengl, wayland and x11. Each plug here names what needs it.
    plugs:
      # Every site, its proxy, and an external tor's SOCKS and control ports.
      - network
      # The built-in tor's SOCKS port (TOR-027) and the egress relay (NETIF-003) listen on loopback.
      - network-bind
      # GLib sends proxy lookups to xdg-desktop-portal once desktop is connected,
      # and the portal answers a snap only when network-status is; WebKit's
      # network process looks one up per request.
      - network-status
      # WPE's GStreamer: a page's sound out.
      - audio-playback
      # WPE's GStreamer: a page's microphone in.
      - audio-record
      # The tray icon's RegisterStatusNotifierItem (NOTIF-019).
      - unity7
      # libsecret (flutter_secure_storage_linux) where no Secret portal answers; the user connects it.
      - password-manager-service

parts:
  libwpe:
    plugin: meson
    source: https://wpewebkit.org/releases/libwpe-1.16.3.tar.xz
    source-checksum: sha256/c880fa8d607b2aa6eadde7d6d6302b1396ebc38368fe2332fa20e193c7ee1420
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
      - -Dbuild-docs=false
    build-packages:
      - libegl-dev
      - libxkbcommon-dev
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  # WebKit main at 323622@main, the merge of WebKit PR 69204 (WebKitFrameInfo,
  # first released in 2.56), as the flatpak builds it; the plugin reads it
  # through weak symbols. The checkout leaves out LayoutTests and JSTests, most
  # of the tree and read by no build step, since the nil plugin copies the
  # source into the build directory.
  wpewebkit:
    after: [libwpe]
    plugin: nil
    override-pull: |
      [ -d .git ] || git init -q .
      git remote add origin https://github.com/WebKit/WebKit.git \
        || git remote set-url origin https://github.com/WebKit/WebKit.git
      git sparse-checkout set --no-cone '/*' '!/LayoutTests/' '!/JSTests/'
      git fetch --depth 1 --filter=blob:none origin c22ba3278caac6a1fc8b0c7a10f04db1ffc44982
      git -c advice.detachedHead=false checkout FETCH_HEAD
    build-environment:
      - CC: clang
      - CXX: clang++
      # Debug info makes WebKit's link outgrow a CI runner's memory and disk.
      - CFLAGS: -g0
      - CXXFLAGS: -g0
      # The Snap workflow keeps this between runs; elsewhere it is a cache
      # like any other.
      - CCACHE_DIR: /var/cache/webspace-snap-ccache
    # The GNOME extension points every part at its SDK, whose glibc headers
    # clang then reads as ordinary headers (its own posix_memalign clashes
    # with them), with the SDK's libraries mixed into Ubuntu's. WebKit builds
    # against Ubuntu 24.04's alone, the release the GNOME 46 runtime and the
    # GPU provider are built from, and libwpe from the stage. Set here, not
    # around `craftctl default`, which sets the extension's environment again.
    # WebKit's bubblewrap sandbox is off: strict confinement grants none of
    # the user namespaces it needs, and snapd confines the processes itself.
    # Its Swift back-forward list is off: WebKit turns it on wherever CMake
    # finds a swiftc, as on a CI runner, and the flatpak's SDK has none.
    # Precompiled headers are off: with them clang splits WebKit into
    # subtargets, and the network process's compiles stop waiting for the
    # WebKitDirectoryInputStreamData.h WebKit generates, a race a 4-job build
    # loses.
    override-build: |
      export PATH=/usr/sbin:/usr/bin:/sbin:/bin
      export PKG_CONFIG_PATH="$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig"
      export CMAKE_PREFIX_PATH="$CRAFT_STAGE/usr"
      unset LD_LIBRARY_PATH PYTHONPATH GI_TYPELIB_PATH ACLOCAL_PATH \
        GDK_PIXBUF_MODULE_FILE GETTEXTDATADIRS XDG_DATA_DIRS
      cmake -S "$CRAFT_PART_SRC" -B wpe -G Ninja \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER_LAUNCHER=ccache \
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
        -DPORT=WPE \
        -DENABLE_DOCUMENTATION=OFF \
        -DENABLE_INTROSPECTION=OFF \
        -DENABLE_MINIBROWSER=OFF \
        -DENABLE_WEBDRIVER=OFF \
        -DENABLE_SPEECH_SYNTHESIS=OFF \
        -DENABLE_BUBBLEWRAP_SANDBOX=OFF \
        -DENABLE_BACK_FORWARD_LIST_SWIFT=OFF \
        -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
        -DENABLE_WPE_PLATFORM_DRM=OFF \
        -DUSE_LIBBACKTRACE=OFF \
        -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF \
        -DUSE_SYSTEM_UNIFDEF=OFF
      cmake --build wpe -- -j"$CRAFT_PARALLEL_BUILD_COUNT"
      ccache --show-stats
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install wpe
    build-packages:
      - ccache
      - clang
      - git
      - gperf
      - ninja-build
      - ruby
      - libatk-bridge2.0-dev
      - libatk1.0-dev
      - libavif-dev
      - libdrm-dev
      - libenchant-2-dev
      - libepoxy-dev
      - libexpat1-dev
      - libfontconfig-dev
      - libfreetype-dev
      - libgbm-dev
      - libgcrypt20-dev
      - libglib2.0-dev
      - libgstreamer-plugins-bad1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer1.0-dev
      - libharfbuzz-dev
      - libhyphen-dev
      - libicu-dev
      - libjpeg-dev
      - libjxl-dev
      - liblcms2-dev
      - libmanette-0.2-dev
      - libpng-dev
      - libsoup-3.0-dev
      - libsqlite3-dev
      - libsystemd-dev
      - libtasn1-6-dev
      - libwayland-dev
      - libwebp-dev
      - libwoff-dev
      - libxkbcommon-dev
      - libxml2-dev
      - libxslt1-dev
      - wayland-protocols
      - zlib1g-dev
    # The one library WebKit links that neither core24, the GNOME runtime nor
    # the GPU provider (mesa-2404) ships. ICU, libxml2 and Wayland come from
    # the GPU provider, as they do for the GNOME runtime's own WebKitGTK.
    stage-packages:
      - libavif16
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/lib/*/cmake

  webspace:
    after: [wpewebkit]
    plugin: nil
    source: .
    parse-info:
      - usr/share/metainfo/org.codeberg.theoden8.webspace.metainfo.xml
    build-packages:
      - build-essential
      - ca-certificates
      - clang
      - cmake
      - curl
      - git
      - libepoxy-dev
      - libgtk-3-dev
      - liblzma-dev
      - libpipewire-0.3-dev
      - libsecret-1-dev
      - lld
      - ninja-build
      - pkg-config
      - unzip
      - xz-utils
    override-build: |
      craftctl set version="$(sed -n 's/^version: *//p' pubspec.yaml)"

      # The part builds a copy of the checkout, with whatever a build on the
      # host left in it: Flutter's CMake cache names the host's path, and a
      # host-built adblock library would be installed instead of one built here.
      rm -rf build .dart_tool linux/flutter/ephemeral \
        rust/webspace_adblock/target linux/lib/libwebspace_adblock.so

      # Flutter at the version .fvmrc pins.
      flutter_version="$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)"
      export FLUTTER_ROOT="$CRAFT_PART_BUILD/../flutter"
      if [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
        git clone --depth 1 --branch "$flutter_version" https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
      fi
      export PATH="$FLUTTER_ROOT/bin:$PATH"
      flutter config --no-analytics --enable-linux-desktop
      dart --disable-analytics

      # Rust at the version rust-toolchain.toml pins. RUSTUP_TOOLCHAIN
      # overrides the file, whose Android targets rustup would otherwise fetch.
      export RUSTUP_HOME="$CRAFT_PART_BUILD/../rustup" CARGO_HOME="$CRAFT_PART_BUILD/../cargo"
      export RUSTUP_TOOLCHAIN="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
      if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
      fi
      export PATH="$CARGO_HOME/bin:$PATH"
      rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # The plugin links the stage's libWPEWebKit and libwpe; linking the
      # executable resolves them through it, which -L does not reach.
      export LDFLAGS="${LDFLAGS:+$LDFLAGS }-Wl,-rpath-link,$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"

      # Under the application ID every native build runs as (PLATFORM-009).
      flutter build linux --release
      bash scripts/verify_adblock_shipped.sh linux
      bundle=build/linux/x64/release/bundle
      bash scripts/verify_tor_shipped.sh "$bundle"

      # The plugin copies WPE into the bundle; the app loads the snap's own
      # copy, the one its helper processes run against.
      rm -f "$bundle"/lib/libWPEWebKit-*.so* "$bundle"/lib/libwpe-*.so*
      mkdir -p "$CRAFT_PART_INSTALL/opt/webspace" "$CRAFT_PART_INSTALL/usr/share"
      cp -a "$bundle"/share/. "$CRAFT_PART_INSTALL/usr/share/"
      rm -r "$bundle"/share
      cp -a "$bundle"/. "$CRAFT_PART_INSTALL/opt/webspace/"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/org.codeberg.theoden8.webspace.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/org.codeberg.theoden8.webspace.desktop"
