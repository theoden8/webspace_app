name: Android toolchain
description: >-
  Flutter from .fvmrc with the project's packages and localizations, and the
  Rust, cargo-ndk, NDK and Gradle the APK build compiles the adblock library
  with. Shared by the Android build and the Android screenshots, which build
  the same app.
inputs:
  cargo-ndk-version:
    description: The workflow's CARGO_NDK_VERSION, the one place it is set.
    required: true
runs:
  using: composite
  steps:
    # GitHub-hosted ubuntu-latest ships with ~14 GB free, but the
    # job's working set is closer to 25 GB once you add: Android
    # SDK/NDK (~10 GB preinstalled), Gradle caches, four Rust
    # target dirs (~2 GB each for the Android cross-compiles), the
    # Flutter build dir, and pub-cache. We've been hitting "No
    # space left on device" mid-build (seen as a CI diag-log write
    # failure, no actual build output). Free the preinstalled
    # heavies we don't use — saves ~30 GB and the disk-pressure
    # margin keeps the build deterministic.
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false  # keep the preinstalled JDK we use below
        android: false     # keep the Android SDK we use below
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Flutter (for Dart SDK)
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: '.fvmrc'
        channel: 'stable'

    - name: Cache fvm Flutter SDK
      uses: actions/cache@v4
      with:
        path: ~/.fvm/versions
        key: fvm-${{ runner.os }}-${{ hashFiles('**/.fvmrc') }}
        restore-keys: |
          fvm-${{ runner.os }}-

    - name: Install fvm
      shell: bash
      run: |
        dart pub global activate fvm
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

    - name: Setup Flutter with fvm
      shell: bash
      run: |
        fvm install
        fvm use --force

    - name: Cache pub dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-

    - name: Get dependencies
      shell: bash
      run: fvm flutter pub get --enforce-lockfile
    - name: Generate localizations
      shell: bash
      run: fvm dart tool/gen_l10n.dart

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/webspace_adblock/target
        key: cargo-android-${{ runner.os }}-${{ hashFiles('rust/webspace_adblock/Cargo.lock') }}
        restore-keys: |
          cargo-android-${{ runner.os }}-

    - name: Read Rust toolchain
      id: rust
      shell: bash
      run: echo "channel=$(sed -n -E 's/channel = "(.*)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

    - name: Install cargo-ndk
      shell: bash
      run: cargo install --locked "cargo-ndk@${{ inputs.cargo-ndk-version }}"

    # cargo-ndk requires ANDROID_NDK_HOME pointing at a real NDK
    # install. The ubuntu-latest runner ships a default NDK under
    # $ANDROID_SDK_ROOT/ndk/, but the path is version-stamped and
    # the actual version drifts across runner image releases. Use
    # the dedicated setup action so we pin a known-good NDK and
    # don't wedge on a path-shape change in the runner image.
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d
        add-to-path: false

    # The Rust .so is built by the buildRustAdblock Gradle task that
    # phase 11 wired into the Android build (see android/app/build.
    # gradle). It auto-runs as a dependency of mergeJniLibFolders, so
    # we don't need an explicit build step here — but the task needs
    # ANDROID_NDK_HOME set on the env, which we export here so every
    # downstream gradle invocation (Kotlin tests + APK build) sees it.
    # GRADLE_OPTS gives those invocations the heap a release build needs.
    - name: Export ANDROID_NDK_HOME and GRADLE_OPTS
      shell: bash
      run: |
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        echo "GRADLE_OPTS=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> $GITHUB_ENV

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Pin to the version declared in android/gradle/wrapper/
        # gradle-wrapper.properties. The wrapper script is gitignored, so
        # the JVM-test and APK steps invoke the `gradle` on PATH; without
        # this pin the runner's preinstalled Gradle (bumped to 9.6.0) drops
        # an internal API that AGP 8.x relies on and the
        # `com.android.application` plugin fails to apply.
        gradle-version: "8.13"
