name: Formal toolchain
description: Install the pinned toolchains needed by a formal stage.
inputs:
  flutter:
    default: 'false'
    description: Install Flutter and the app's test dependencies.
  lean:
    default: 'false'
    description: Install the Lean toolchain.
  proofs:
    default: 'false'
    description: Install TLAPS.
outputs:
  tlapm-pin:
    value: ${{ steps.tlapm.outputs.pin }}
    description: >-
      The SHA-256 of the TLAPS build installed: the key its proof cache is
      kept under, since the release's version string stays the same when
      upstream rebuilds it.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: subosito/flutter-action@v2
      if: inputs.flutter == 'true'
      with:
        flutter-version-file: '.fvmrc'
        channel: stable
    - uses: ./.github/actions/master-cache
      if: inputs.flutter == 'true'
      with:
        path: ~/fvm/versions
        key: fvm-${{ runner.os }}-${{ hashFiles('**/.fvmrc') }}
        restore-keys: fvm-${{ runner.os }}-
    - shell: bash
      if: inputs.flutter == 'true'
      run: |
        dart pub global activate fvm
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
    - shell: bash
      if: inputs.flutter == 'true'
      run: |
        fvm install
        fvm use --force
    - uses: ./.github/actions/master-cache
      if: inputs.flutter == 'true'
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-
    - shell: bash
      if: inputs.flutter == 'true'
      run: |
        fvm flutter pub get --enforce-lockfile
        fvm dart tool/gen_l10n.dart
    - uses: ./.github/actions/master-cache
      if: inputs.lean == 'true'
      with:
        path: ~/.elan
        key: elan-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain') }}
    - shell: bash
      if: inputs.lean == 'true'
      run: |
        [ -x "$HOME/.elan/bin/elan" ] || curl -fsSL --retry 4 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none --no-modify-path
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    # The 1.6.0-pre asset is rebuilt in place upstream, so the build is
    # pinned by its hash: master caches the tarball under that hash, and a
    # download that does not match fails. Moving the pin is a deliberate
    # change, paid for with one cold proof run.
    - id: pin
      shell: bash
      if: inputs.proofs == 'true'
      run: |
        echo "url=https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz" >> "$GITHUB_OUTPUT"
        echo "sha256=99db29f119cb6f43ffed653b212ba2d005e5bf8e242c53468876cb0d08da6bcc" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/master-cache
      if: inputs.proofs == 'true'
      with:
        path: ~/tlapm-dist
        key: tlapm-dist-${{ runner.os }}-${{ steps.pin.outputs.sha256 }}
    - id: tlapm
      shell: bash
      if: inputs.proofs == 'true'
      env:
        TLAPM_URL: ${{ steps.pin.outputs.url }}
        TLAPM_SHA256: ${{ steps.pin.outputs.sha256 }}
      run: |
        tarball="$HOME/tlapm-dist/tlapm.tar.gz"
        if [ ! -f "$tarball" ]; then
          mkdir -p "$HOME/tlapm-dist"
          curl -fsSL --retry 4 --retry-delay 2 -o "$tarball" "$TLAPM_URL"
        fi
        got="$(sha256sum "$tarball" | cut -d' ' -f1)"
        if [ "$got" != "$TLAPM_SHA256" ]; then
          echo "::error::the TLAPS build at $TLAPM_URL is $got, not the pinned $TLAPM_SHA256: upstream rebuilt it. Move the pin in .github/actions/setup-formal/action.yml; the next proof run is cold."
          exit 1
        fi
        tar -xzf "$tarball" -C "$HOME"
        echo "$HOME/tlapm/bin" >> "$GITHUB_PATH"
        "$HOME/tlapm/bin/tlapm" --version
        echo "pin=$TLAPM_SHA256" >> "$GITHUB_OUTPUT"
