name: Android emulator
description: >-
  KVM, the SDK's platform tools and a booted-once AVD snapshot for
  reactivecircus/android-emulator-runner, shared by the emulator scenarios and
  the Android screenshots. A run step that boots it passes the same api-level,
  target, arch, profile and disk-size, or the snapshot is not reused. The
  inputs default to the phone AVD; the Android TV tier names its own.
inputs:
  api-level:
    description: The AVD's API level.
    default: '35'
  target:
    description: The system image, `default` (AOSP) or `android-tv`.
    default: default
  profile:
    description: The AVD's device profile.
    default: pixel_5
runs:
  using: composite
  steps:
    - name: Enable KVM for emulator acceleration
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # packages: the action defaults to "tools platform-tools", and the
    # obsolete "tools" package is gone from Google's repository, so the
    # default install aborts the job with "Failed to find package 'tools'".
    # Nothing here uses it; the emulator runner installs what it needs.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: AVD snapshot cache
      id: avd-cache
      uses: ./.github/actions/master-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-api${{ inputs.api-level }}-x86_64-${{ inputs.target == 'default' && 'aosp' || inputs.target }}-${{ inputs.profile }}-v1

    # The runner's closing `adb emu kill` exits 255 once the emulator has
    # saved the snapshot it writes on exit, failing this step after its work
    # is done; the check below holds it to the snapshot instead.
    - name: Pre-warm AVD snapshot
      if: steps.avd-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: x86_64
        profile: ${{ inputs.profile }}
        disk-size: 4096M
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: echo "Generated AVD snapshot for caching."

    - name: Check the pre-warmed snapshot
      if: steps.avd-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        snap=~/.android/avd/test.avd/snapshots/default_boot
        if [ -z "$(ls -A "$snap" 2>/dev/null)" ]; then
          echo "::error::the pre-warm left no snapshot at $snap"
          exit 1
        fi
