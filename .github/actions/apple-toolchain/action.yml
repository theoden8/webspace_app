name: Apple toolchain
description: >-
  Flutter from .fvmrc with the project's packages and localizations,
  CocoaPods, the Go the IPtProxy pod builds with, and the Rust adblock
  library the webspace_adblock pod vendors. Shared by the iOS and macOS build
  and the Apple screenshots, which build the same app.
runs:
  using: composite
  steps:
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1

    - name: Install CocoaPods
      shell: bash
      run: |
        brew install cocoapods
        brew link --force cocoapods

    - name: Cache fvm Flutter SDK
      uses: actions/cache@v4
      with:
        path: ~/.fvm/versions
        key: fvm-${{ runner.os }}-${{ hashFiles('**/.fvmrc') }}
        restore-keys: |
          fvm-${{ runner.os }}-

    - name: Install fvm
      shell: bash
      run: |
        dart pub global activate fvm
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

    - name: Setup Flutter with fvm
      shell: bash
      run: |
        fvm install
        fvm use --force

    - name: Cache pub dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-

    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: |
          ios/Pods
          macos/Pods
          ~/Library/Caches/CocoaPods
          ~/.cocoapods/repos
        key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'macos/Podfile.lock') }}
        restore-keys: |
          pods-${{ runner.os }}-

    - name: Get dependencies
      shell: bash
      run: fvm flutter pub get --enforce-lockfile
    - name: Generate localizations
      shell: bash
      run: fvm dart tool/gen_l10n.dart

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/webspace_adblock/target
        key: cargo-apple-${{ runner.os }}-${{ hashFiles('rust/webspace_adblock/Cargo.lock') }}
        restore-keys: |
          cargo-apple-${{ runner.os }}-

    # The IPtProxy pod has no prebuilt binary: its prepare_command
    # cross-compiles the transports from Go with gomobile during `pod
    # install`, which `flutter build ipa` runs. Pinned rather than left to
    # whatever the runner image ships, because the pod needs 1.24+ and a
    # runner image bump is not something this build should notice.
    - name: Setup Go (for the IPtProxy pod's gomobile build)
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Read Rust toolchain
      id: rust
      shell: bash
      run: echo "channel=$(sed -n -E 's/channel = "(.*)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

    # Build the rust .xcframework + macOS fat .a + keep_alive.c into
    # rust/webspace_adblock/cocoapods/, where the webspace_adblock
    # podspec consumes them as vendored binaries. CocoaPods handles the
    # link via standard pod machinery (no force_load / -Wl,-u / pbxproj
    # mutation), so this just needs to run before pod install.
    - name: Build Rust adblock for Apple (xcframework + macOS .a)
      shell: bash
      run: |
        bash scripts/build_rust.sh apple
        ls -la rust/webspace_adblock/cocoapods/
