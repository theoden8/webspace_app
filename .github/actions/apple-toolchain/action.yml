name: Apple toolchain
description: >-
  Flutter from .fvmrc with the project's packages and localizations,
  CocoaPods, the Rust adblock library the webspace_adblock pod vendors, and
  the IPtProxy framework the bridge transports' pod vendors, built with the Go
  go/iptproxy/.go-version names. Shared by the iOS and macOS build and the
  Apple screenshots, which build the same app.
runs:
  using: composite
  steps:
    # Not dart-lang/setup-dart: it registers its problem matcher from
    # GITHUB_ACTION_PATH, which inside this composite names this folder, and
    # fails the step.
    - name: Setup Flutter (for Dart SDK)
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: '.fvmrc'
        channel: 'stable'

    - name: Install CocoaPods
      shell: bash
      run: |
        brew install cocoapods
        brew link --force cocoapods

    - name: Cache fvm Flutter SDK
      uses: ./.github/actions/master-cache
      with:
        path: ~/fvm/versions
        key: fvm-${{ runner.os }}-${{ hashFiles('**/.fvmrc') }}
        restore-keys: |
          fvm-${{ runner.os }}-

    - name: Install fvm
      shell: bash
      run: |
        dart pub global activate fvm
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

    - name: Setup Flutter with fvm
      shell: bash
      run: |
        fvm install
        fvm use --force

    - name: Cache pub dependencies
      uses: ./.github/actions/master-cache
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-

    - name: Cache CocoaPods
      uses: ./.github/actions/master-cache
      with:
        path: |
          ios/Pods
          macos/Pods
          ~/Library/Caches/CocoaPods
          ~/.cocoapods/repos
        key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'macos/Podfile.lock') }}
        restore-keys: |
          pods-${{ runner.os }}-

    - name: Get dependencies
      shell: bash
      run: fvm flutter pub get --enforce-lockfile
    - name: Generate localizations
      shell: bash
      run: fvm dart tool/gen_l10n.dart

    - name: Cache cargo registry
      uses: ./.github/actions/master-cache
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/webspace_adblock/target
        key: cargo-apple-${{ runner.os }}-${{ hashFiles('rust/webspace_adblock/Cargo.lock') }}
        restore-keys: |
          cargo-apple-${{ runner.os }}-

    - name: Read Rust toolchain
      id: rust
      shell: bash
      run: echo "channel=$(sed -n -E 's/channel = "(.*)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

    # Build the rust .xcframework + macOS fat .a + keep_alive.c into
    # rust/webspace_adblock/cocoapods/, where the webspace_adblock
    # podspec consumes them as vendored binaries. CocoaPods handles the
    # link via standard pod machinery (no force_load / -Wl,-u / pbxproj
    # mutation), so this just needs to run before pod install.
    - name: Build Rust adblock for Apple (xcframework + macOS .a)
      shell: bash
      run: |
        bash scripts/build_rust.sh apple
        ls -la rust/webspace_adblock/cocoapods/

    # IPtProxy, the pluggable transports for Tor bridges (TOR-016), is a pod
    # we own at go/iptproxy/, built from pinned sources with gomobile; the Go
    # is the one .go-version names, as rust-toolchain.toml names the Rust.
    - name: Setup Go (for go/iptproxy)
      uses: actions/setup-go@v5
      with:
        go-version-file: go/iptproxy/.go-version
        cache: false

    # Keyed on what the build reads, and nothing restored on a miss: build.sh
    # stamps the framework with the same inputs and rebuilds on any other.
    - name: Cache IPtProxy.xcframework
      uses: ./.github/actions/master-cache
      with:
        path: |
          go/iptproxy/IPtProxy.xcframework
          go/iptproxy/IPtProxy.inputs
          go/iptproxy/LICENSES.txt
        key: iptproxy-${{ runner.os }}-${{ hashFiles('go/iptproxy/.go-version', 'go/iptproxy/build.sh', 'go/iptproxy/iptproxy.patch', 'go/iptproxy/licences.tsv', 'go/hiddenkey/hiddenkey.go', 'go/hiddenkey/go.mod', 'go/hiddenkey/fetch-monocypher.sh', 'go/meekutls/meekutls.go', 'go/meekutls/LICENSE') }}

    - name: Build IPtProxy.xcframework (TOR-016)
      shell: bash
      run: sh go/iptproxy/build.sh

    # LICENSE-001: go list over every package the framework is built from,
    # and the framework itself, whether built above or restored.
    - name: Check IPtProxy for GPL code (LICENSE-001)
      shell: bash
      run: |
        sh go/iptproxy/build.sh check
        # Nothing after this reads them, and the macOS job's integration
        # loop is short of disk: the Podfiles' build.sh finds its stamp current.
        go clean -cache -modcache
        rm -rf go/iptproxy/build
