name: Build

# Builds and artifacts only. Tests, formal verification and the integration
# tiers run locally (CLAUDE.md, Commands); CI does not repeat them.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: 'Only the store screenshots: every device at once, into the one screenshots artifact. No build job runs.'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the cargo-ndk version. The F-Droid recipe
# seds this line; every job reads it via the env context. Bump here only.
env:
  CARGO_NDK_VERSION: "4.1.2"
  # The Debian sid the Linux containers install from: a dated
  # snapshot.debian.org view, so a transition landing in sid cannot break
  # every PR's install at once. The containers' image is dated no later than
  # it (debian:sid-<date>-slim; container.image cannot read env).
  DEBIAN_SNAPSHOT: "20261111T180000Z"

jobs:
  # Which jobs this commit needs. `[ci-only: apple]` in the commit message,
  # or several as `[ci-only: android,linux]`, skips the rest. Tokens: android,
  # linux, apple, screenshots. Honoured on pull_request only.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.pick.outputs.android }}
      linux: ${{ steps.pick.outputs.linux }}
      apple: ${{ steps.pick.outputs.apple }}
      only: ${{ steps.pick.outputs.only }}
      screenshots: ${{ steps.screenshots.outputs.screenshots }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request ref is a merge commit whose message is
          # "Merge A into B", so read the branch head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - id: pick
        run: |
          set -eu
          only=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            only="$(git log -1 --pretty=%B \
              | sed -n 's/.*\[ci-only:[[:space:]]*\([^]]*\)\].*/\1/p' \
              | head -1 | tr -d '[:space:]')"
          elif [ "${{ inputs.screenshots_only }}" = true ]; then
            only=screenshots
          fi
          pick() {
            if [ -z "$only" ]; then
              echo "$1=true"
              return
            fi
            case ",$only," in
              *",$1,"*) echo "$1=true" ;;
              *) echo "$1=false" ;;
            esac
          }
          {
            pick android
            pick linux
            pick apple
            echo "only=$only"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$only" ]; then
            echo "::notice::ci-only=$only -- every other job is skipped for this commit"
          fi
      # The store screenshots: on a manual run, and on a release PR, which is
      # one that moves pubspec.yaml's version line (docs/releasing.md). A
      # ci-only marker that names them runs them, and one that does not skips
      # them.
      - id: screenshots
        run: |
          set -eu
          only="${{ steps.pick.outputs.only }}"
          screenshots=false
          if [ -n "$only" ]; then
            case ",$only," in
              *,screenshots,*) screenshots=true ;;
            esac
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            screenshots=true
          elif [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            head_version="$(sed -n 's/^version: //p' pubspec.yaml)"
            base_version="$(git show FETCH_HEAD:pubspec.yaml | sed -n 's/^version: //p')"
            if [ "$head_version" != "$base_version" ]; then
              screenshots=true
              echo "::notice::release PR ($base_version -> $head_version): screenshots run"
            fi
          fi
          echo "screenshots=$screenshots" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.android == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Oversize metadata silently breaks the F-Droid sync; seconds.
      - name: Validate Fastlane metadata
        run: ./scripts/validate_fastlane_metadata.sh

      - name: Android toolchain
        uses: ./.github/actions/android-toolchain
        with:
          cargo-ndk-version: ${{ env.CARGO_NDK_VERSION }}

      - name: Generate launcher icons
        run: fvm dart run flutter_launcher_icons

      # The checks after the build read the APKs it made and take seconds:
      # adblock .so shipped, Maven and APK licences (LICENSE-001/002), no
      # Google Mobile Services (PROF-007), JNI entry points kept by R8.
      - name: Build APK
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            fvm flutter build apk --release --flavor fdroid
          else
            fvm flutter build apk --release --flavor fdroid --split-per-abi
          fi
          bash scripts/verify_adblock_shipped.sh android
          node tool/check_maven_licences.js assets/native_notices/maven.json
          shopt -s nullglob
          apks=( build/app/outputs/flutter-apk/*-fdroid-release.apk )
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: no fdroid APK found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            dir=$(mktemp -d)
            unzip -q "$apk" -d "$dir"
            node tool/check_artifact_licences.js "$dir"
            rm -rf "$dir"
            bash scripts/check_no_gms.sh "$apk"
            bash scripts/check_jni_intact.sh "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    # Debian sid for libwpewebkit-2.0-dev >= 2.50 (the fork calls 2.50 API);
    # installed from the dated snapshot DEBIAN_SNAPSHOT names.
    container:
      image: debian:sid-20261104-slim
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      # git before the checkout, so it is a clone and not a REST download:
      # debian:sid-slim ships without it. Every apt step after this one
      # reads the snapshot written here.
      - name: Install git
        run: |
          printf 'Types: deb\nURIs: http://snapshot.debian.org/archive/debian/%s/\nSuites: sid\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\nCheck-Valid-Until: no\n' \
            "$DEBIAN_SNAPSHOT" >/etc/apt/sources.list.d/debian.sources
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain

      # The bundle's lyrebird (TOR-016): linux/tor.cmake builds it with
      # go/iptproxy/build.sh, and without a go command builds none.
      - name: Setup Go (for the bundle's lyrebird)
        uses: actions/setup-go@v5
        with:
          go-version-file: go/iptproxy/.go-version
          cache: false

      - name: Build Linux
        run: |
          # flutter says only "Build process failed" when a CMake step fails;
          # building again with CMake shows the failing command and its output.
          fvm flutter build linux --release \
            || { cmake --build build/linux/x64/release 2>&1 | tail -n 200; exit 1; }
          bash scripts/verify_adblock_shipped.sh linux
          bash scripts/verify_tor_shipped.sh build/linux/x64/release/bundle

  build-apple:
    name: Build iOS & macOS
    runs-on: macos-latest
    needs: plan
    if: needs.plan.outputs.apple == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apple toolchain
        uses: ./.github/actions/apple-toolchain

      - name: Generate launcher icons
        run: fvm dart run flutter_launcher_icons

      # The unsigned IPA is installed outside the App Store (sideloaded), so it
      # is the direct flavor (WEBEXT-019). --no-codesign skips the IPA export,
      # so the IPA is the .app under Payload/, zipped.
      - name: Build IPA
        run: |
          fvm flutter build ipa --release --no-codesign --flavor direct
          bash scripts/verify_adblock_shipped.sh ios
          bash scripts/verify_tor_framework.sh ios/Pods
          bash scripts/check_extension_search.sh present \
            build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Frameworks/App.framework/App
          bash scripts/check_webkit_block_reports.sh present \
            build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          test -d "$app"
          node tool/check_artifact_licences.js "$app"
          mkdir -p build/ios/ipa/Payload
          ditto "$app" build/ios/ipa/Payload/Runner.app
          (cd build/ios/ipa && zip -qry webspace-unsigned.ipa Payload && rm -rf Payload)
          ls -l build/ios/ipa

      # The ad-hoc re-sign is what makes the artifact launchable without a
      # signing identity (docs/releasing-macos.md).
      - name: Build macOS
        run: |
          fvm flutter build macos --release
          bash scripts/verify_adblock_shipped.sh macos
          bash scripts/verify_tor_framework.sh macos/Pods
          bash scripts/check_extension_search.sh absent \
            build/macos/Build/Products/Release/webspace.app/Contents/Frameworks/App.framework/App
          bash scripts/check_webkit_block_reports.sh absent \
            build/macos/Build/Products/Release/webspace.app
          node tool/check_artifact_licences.js build/macos/Build/Products/Release/webspace.app
          bash scripts/sign_macos.sh adhoc

      # The builds' pod installs wrote both Podfile.locks, failed build
      # included: no machine without macOS can.
      - name: Hand in lock files
        if: success() || failure()
        uses: ./.github/actions/lockfiles

      - name: Create macOS ZIP archive
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../webspace-macos.zip webspace.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: webspace-macos.zip
          if-no-files-found: error

  # The store screenshots, a job per device, so every set is taken at once
  # and none waits on a build or a test tier. The plan job decides which runs
  # make them.
  screenshots-android:
    name: Screenshots (Android)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.screenshots == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Android toolchain
        uses: ./.github/actions/android-toolchain
        with:
          cargo-ndk-version: ${{ env.CARGO_NDK_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The distro's ImageMagick 6, through mini_magick in frameit and in the
      # resize lane. The pinned `magick` binary this downloaded went 404, and
      # curl without -f saved the error page in its place.
      - name: Install ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends imagemagick

      - name: Android emulator
        uses: ./.github/actions/android-emulator

      - name: Generate Android screenshots
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            mkdir -p screenshots/android
            bundle exec fastlane android screenshots

      # Before framing, which resizes these files in place and writes
      # *_framed.png beside them: the set is the eight shots as taken, and
      # a framing failure does not withhold it.
      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: screenshots/android/*.png
          if-no-files-found: warn

      - name: Cache Fastlane frameit assets
        uses: ./.github/actions/master-cache
        with:
          path: ~/.fastlane/frameit/latest
          key: frameit-${{ runner.os }}

      - name: Add device frames to screenshots
        run: bundle exec fastlane android add_device_frames

      - name: Upload framed Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-framed-screenshots
          path: screenshots/android/*_framed.png
          if-no-files-found: error

  # iPhone and iPad on a simulator each. A set is resized to its App Store
  # size, so the simulator is the last Pro the runner's Xcode lists, near
  # that aspect, and any of its family only when there is none.
  screenshots-ios:
    name: Screenshots (${{ matrix.device }})
    runs-on: macos-latest
    needs: plan
    if: needs.plan.outputs.screenshots == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            family: iPhone
            simulator: '^iPhone [0-9]+ Pro$'
          - device: ipad
            family: iPad
            simulator: '^iPad (Pro|Air) 13-inch|^iPad Pro \(12\.9-inch\)'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apple toolchain
        uses: ./.github/actions/apple-toolchain

      # The runner image's formula data trails Homebrew and brew does not
      # refresh it on install: it kept serving ImageMagick 7.1.2-33, whose
      # mogrify cannot write, after 7.1.2-34 fixed it.
      - name: Install ImageMagick and Fastlane
        run: |
          brew update --quiet
          brew install imagemagick-full fastlane
          brew link --force imagemagick-full
          brew link --force fastlane
          magick -version | head -n 1

      - name: Boot the simulator
        id: simulator
        env:
          FAMILY: ${{ matrix.family }}
          PREFERRED: ${{ matrix.simulator }}
        run: |
          set -eu
          xcrun simctl list devices available
          pick() {
            xcrun simctl list devices available -j \
              | jq -r --arg re "$1" '[.devices[][] | select(.name | test($re))] | last | .udid // empty'
          }
          udid="$(pick "$PREFERRED")"
          [ -n "$udid" ] || udid="$(pick "^$FAMILY")"
          if [ -z "$udid" ]; then
            echo "::error::no $FAMILY simulator on this runner"
            exit 1
          fi
          xcrun simctl bootstatus "$udid" -b
          sleep 10
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Generate the screenshots
        timeout-minutes: 45
        run: fastlane ios screenshots device:${{ matrix.device }} udid:${{ steps.simulator.outputs.udid }}

      - name: Hand in lock files
        if: success() || failure()
        uses: ./.github/actions/lockfiles
        with:
          name: screenshots-${{ matrix.device }}

      # The iPad lane builds with UIRequiresFullScreen and must put the
      # shipped Info.plist back, failed run included (SCREENSHOT-010).
      - name: Info.plist is as shipped
        if: success() || failure()
        run: git diff --exit-code -- ios/Runner/Info.plist

      - name: Cache Fastlane frameit assets
        uses: ./.github/actions/master-cache
        with:
          path: ~/.fastlane/frameit/latest
          key: frameit-${{ runner.os }}

      - name: Add device frames
        run: fastlane ios add_device_frames device:${{ matrix.device }}

      # The shots at their App Store size, which the framing lane resized
      # them to; kept when framing fails.
      - name: Upload the screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-screenshots
          path: |
            screenshots/ios/${{ matrix.device }}/*.png
            !screenshots/ios/${{ matrix.device }}/*_framed.png
          if-no-files-found: warn

      - name: Upload the framed screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-framed-screenshots
          path: screenshots/ios/${{ matrix.device }}/*_framed.png
          if-no-files-found: error

  screenshots-macos:
    name: Screenshots (macOS)
    runs-on: macos-latest
    needs: plan
    if: needs.plan.outputs.screenshots == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apple toolchain
        uses: ./.github/actions/apple-toolchain

      - name: Install Fastlane
        run: |
          brew install fastlane
          brew link --force fastlane

      # The debug build takes the entitlements the macOS test tier runs with,
      # and the lane passes --ci for the same reason that tier does.
      - name: Prepare the macOS debug run
        run: bash scripts/prepare_macos_ci_debug.sh

      - name: Generate macOS screenshots
        timeout-minutes: 30
        run: fastlane mac screenshots

      - name: Hand in lock files
        if: success() || failure()
        uses: ./.github/actions/lockfiles

      - name: Upload macOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: screenshots/macos/*.png
          if-no-files-found: warn

  # In the container the Linux build runs in, for the same WPE WebKit. The
  # session gives GTK a Wayland display, so the window carries the title bar
  # and shadow Flathub asks for.
  screenshots-linux:
    name: Screenshots (Linux)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.screenshots == 'true'
    container:
      image: debian:sid-20261104-slim
    steps:
      # git before the checkout, so it is a clone and not a REST download:
      # debian:sid-slim ships without it. Every apt step after this one
      # reads the snapshot written here.
      - name: Install git
        run: |
          printf 'Types: deb\nURIs: http://snapshot.debian.org/archive/debian/%s/\nSuites: sid\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\nCheck-Valid-Until: no\n' \
            "$DEBIAN_SNAPSHOT" >/etc/apt/sources.list.d/debian.sources
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Linux toolchain
        uses: ./.github/actions/linux-toolchain

      - name: Generate Linux screenshots
        timeout-minutes: 30
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -x
          apt-get update
          apt-get install -y --no-install-recommends ruby ruby-dev ruby-bundler
          bundle install
          bash scripts/linux_test_session.sh bundle exec fastlane linux screenshots

      # The bundle install above is not frozen, so it can add this
      # platform to Gemfile.lock.
      - name: Hand in lock files
        if: success() || failure()
        uses: ./.github/actions/lockfiles

      - name: Upload Linux screenshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: screenshots/linux/*.png
          if-no-files-found: warn

  # The screenshots in one download, a folder per device. Runs when a set
  # failed too, to keep the sets that were made.
  screenshots:
    name: Screenshots
    needs: [plan, screenshots-android, screenshots-ios, screenshots-macos, screenshots-linux]
    if: needs.plan.outputs.screenshots == 'true' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Merge every platform's screenshots
        uses: actions/upload-artifact/merge@v4
        with:
          name: screenshots
          pattern: '*-screenshots'
          separate-directories: true

  # Every lock file in one download, as this run resolved it: the commit's,
  # with what each job handed in laid over it (scripts/lockfiles.sh).
  # Unzipped at the repository root it updates them all at once, the
  # Podfile.locks only a macOS build writes among them. Runs when a job
  # failed too: a failed build may be the one that needs a new lock file.
  lockfiles:
    name: Lock files
    needs: [build-apple, screenshots-ios, screenshots-macos, screenshots-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download each job's hand-in
        uses: actions/download-artifact@v4
        with:
          pattern: lockfiles-*
          path: ${{ runner.temp }}/lockfile-runs

      - name: Lay them over the commit
        run: bash scripts/lockfiles.sh bundle "$RUNNER_TEMP/lockfile-runs" "$RUNNER_TEMP/lockfiles"

      - name: Upload every lock file
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles
          path: ${{ runner.temp }}/lockfiles/
          if-no-files-found: error

  release-summary:
    name: Release Summary
    needs: [build-android, build-linux, build-apple]
    runs-on: ubuntu-latest
    if: success()
    steps:
      # By name, and only these three: a named download fails when the
      # artifact is absent, and the rest of what the run uploads (screenshots,
      # diagnostics, the egress recording) is nothing this job reports on.
      - name: Download the Android build
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: artifacts/android
      - name: Download the iOS build
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/ios
      - name: Download the macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos

      # What was actually built, and how big it is. The previous summary
      # printed a fixed list of checkmarks that nothing verified: it claimed
      # an IPA CI never produced, a Linux build CI never uploads, and ABI
      # splits that pull requests do not build. Sizes are the useful part --
      # the Tor pods' footprint on the IPA is a number, not an estimate.
      - name: Report the artifacts
        run: |
          set -eu
          # Rows first, so an empty artifact fails on stdout, where the
          # runner reads ::error:: -- not inside the summary redirect.
          rows=""
          for dir in android ios macos; do
            found=0
            for f in artifacts/$dir/*; do
              [ -f "$f" ] || continue
              found=1
              bytes=$(stat -c %s "$f")
              mb=$(awk "BEGIN { printf \"%.1f MB\", $bytes / 1048576 }")
              rows="$rows| $dir | \`$(basename "$f")\` | $mb |
          "
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::the $dir artifact downloaded but holds no file"
              exit 1
            fi
          done
          {
            echo "## Build artifacts"
            echo ""
            echo "| platform | file | size |"
            echo "|---|---|---|"
            printf '%s' "$rows"
            echo ""
            echo "Linux is built, but no Linux bundle is uploaded as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"