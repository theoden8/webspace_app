name: Flatpak

# Builds the flatpak through scripts/build_flatpak.sh, with no network inside
# the build. Kept out of build-and-test.yml because a cold WPE WebKit build
# takes hours: this runs only when a packaging input changes, and restores the
# finished WPE module from the cache when its definition has not.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # A release tag builds the bundle its GitHub release carries. GitHub
    # applies no path filter to a tag push.
    tags:
      - 'v*'
    paths:
      - .github/workflows/flatpak.yml
      - scripts/build_flatpak.sh
      - scripts/verify_webkit_shipped.sh
      - tool/check_bundle_licences.js
      - test/js/helpers/licences.js
      - test/js/helpers/dart_blocks.js
      - test/js/helpers/source.js
      - tool/check_source_offer.js
      - linux/**
      - pubspec.lock
      - rust/webspace_adblock/**
  pull_request:
    paths:
      - .github/workflows/flatpak.yml
      - scripts/build_flatpak.sh
      - scripts/verify_webkit_shipped.sh
      - tool/check_bundle_licences.js
      - test/js/helpers/licences.js
      - test/js/helpers/dart_blocks.js
      - test/js/helpers/source.js
      - tool/check_source_offer.js
      - linux/**
      - pubspec.lock
      - rust/webspace_adblock/**

# A run in progress is left to finish: it is the one that fills the cache the
# queued run then builds from; cancelling one loses the WPE it was compiling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flatpak:
    name: Build flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # WebKit's checkout and build tree do not fit beside the preinstalled
      # toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils python3-venv
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Ubuntu 24.04 confines unprivileged user namespaces, which
          # flatpak-builder's bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore flatpak-builder cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/flatpak/state/cache
          key: flatpak-${{ hashFiles('linux/flatpak/flatpak-flutter.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-${{ hashFiles('linux/flatpak/flatpak-flutter.yml') }}-
            flatpak-

      - name: Build
        run: bash scripts/build_flatpak.sh "${{ github.event.pull_request.head.sha || github.sha }}"

      # What the built /app holds: every copyright file in it names a licence
      # the policy lets ship and no GNU notice sits outside the notices
      # (LICENSE-001), WebKit is a library a user can replace, with PDF.js's
      # OFL fonts, and the source its notices offer is one Software Heritage
      # keeps (LICENSE-004).
      - name: Check the flatpak's licences
        run: |
          node tool/check_bundle_licences.js build/flatpak/app/files
          bash scripts/verify_webkit_shipped.sh build/flatpak/app/files webspace
          node tool/check_source_offer.js build/flatpak/app/files

      # Saved even when the app module fails, so the next run starts from a
      # built WPE.
      - name: Save flatpak-builder cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/flatpak/state/cache
          key: flatpak-${{ hashFiles('linux/flatpak/flatpak-flutter.yml') }}-${{ github.sha }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: webspace-flatpak
          path: build/flatpak/*.flatpak
          if-no-files-found: error
