name: Formal verification
on:
  workflow_call:
    inputs:
      cold:
        type: boolean
        default: false
        description: Run every TLC check and proof without restoring verification caches.
jobs:
  prepare:
    name: Print models and check Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-formal
        with:
          flutter: 'true'
          lean: 'true'
      - run: ./formal/verify.sh --stage prepare
      - uses: actions/upload-artifact@v4
        with:
          name: formal-model
          path: build/formal/model
          if-no-files-found: error
  schedules:
    name: Explore schedules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-formal
        with:
          flutter: 'true'
      - run: ./formal/verify.sh --stage schedules
        timeout-minutes: 300
      - uses: actions/upload-artifact@v4
        with:
          name: formal-schedules
          path: build/formal/steps
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: formal-schedule-failure
          path: build/formal
  models:
    name: TLC models (${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Warm or cold alike: a change to the model misses the memo for every
        # world that reads it, and one runner then checks them all in turn
        # (four hours for one invariant). A shard with nothing to run is done
        # in its start-up.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-formal
      - uses: actions/download-artifact@v4
        with:
          name: formal-model
          path: build/formal/model
      # One memo for every shard, kept by the memo job: a check's shard is
      # its place in the list modulo four, which a new check moves.
      - id: formal-cache
        uses: actions/cache/restore@v4
        if: ${{ !inputs.cold }}
        with:
          path: ~/.cache/webspace-formal
          key: formal-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            formal-v3-${{ runner.os }}-
            formal-v2-${{ runner.os }}-1-0-
      - name: Restore from master's newest artifact when the cache is gone
        if: ${{ !inputs.cold && steps.formal-cache.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # First master's memo from when one runner checked a warm run, until
        # it expires: an entry is keyed by what its check reads, so a merged
        # one can only add hits.
        run: |-
          for name in formal-memo-0-of-1 formal-memo; do
            scripts/restore_formal_artifact.sh "$name" "$HOME/.cache/webspace-formal"
          done
      - name: Note the memo before the checks
        run: |
          mkdir -p "$HOME/.cache/webspace-formal/memo"
          ls "$HOME/.cache/webspace-formal/memo" | LC_ALL=C sort >"$RUNNER_TEMP/memo-before"
          touch "$RUNNER_TEMP/memo-marker"
      - id: formal-verify
        run: |
          if [ "${{ inputs.cold }}" = true ]; then rm -rf "$HOME/.cache/webspace-formal"; fi
          ./formal/verify.sh --stage models
        timeout-minutes: 300
        env:
          FORMAL_SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
          FORMAL_RERUN: ${{ inputs.cold && '1' || '' }}
      # What this shard added to the memo and the entries it used, which the
      # memo job keeps, so a shard that failed or timed out keeps what it ran.
      - name: Collect what the checks added to the memo
        if: ${{ always() && steps.formal-verify.outcome != '' && steps.formal-verify.outcome != 'skipped' }}
        run: |
          cd "$HOME/.cache/webspace-formal"
          out="$RUNNER_TEMP/memo-new"
          mkdir -p "$out" memo times
          ls memo | LC_ALL=C sort | LC_ALL=C comm -13 "$RUNNER_TEMP/memo-before" - | sed 's|^|memo/|' >"$out/added"
          find times -type f -newer "$RUNNER_TEMP/memo-marker" >>"$out/added"
          find memo -type f -newer "$RUNNER_TEMP/memo-marker" >"$out/used"
          tar -cf "$out/added.tar" -T "$out/added"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.formal-verify.outcome != '' && steps.formal-verify.outcome != 'skipped' }}
        with:
          name: formal-memo-new-${{ strategy.job-index }}
          path: ${{ runner.temp }}/memo-new
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      # A shard that failed or timed out still uploads what it ran; a re-run
      # of it replaces that upload, or the finish job reads both.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-model-${{ strategy.job-index }}
          path: build/formal/model-shards/local
          if-no-files-found: error
          overwrite: true
  memo:
    name: Keep the TLC memo
    needs: models
    if: ${{ always() && needs.models.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: formal-cache
        uses: actions/cache/restore@v4
        if: ${{ !inputs.cold }}
        with:
          path: ~/.cache/webspace-formal
          key: formal-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            formal-v3-${{ runner.os }}-
            formal-v2-${{ runner.os }}-1-0-
      - name: Restore from master's newest artifact when the cache is gone
        if: ${{ !inputs.cold && steps.formal-cache.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          for name in formal-memo-0-of-1 formal-memo; do
            scripts/restore_formal_artifact.sh "$name" "$HOME/.cache/webspace-formal"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: formal-memo-new-*
          path: ${{ runner.temp }}/memo-new
      # Every shard's additions, and a touch for each entry a shard used, so
      # an entry checks still read is not dropped as a fortnight old.
      - id: formal-merge
        run: |
          memo="$HOME/.cache/webspace-formal"
          if [ "${{ inputs.cold }}" = true ]; then rm -rf "$memo"; fi
          mkdir -p "$memo"
          shopt -s nullglob
          for shard in "$RUNNER_TEMP"/memo-new/*/; do
            tar -xf "$shard/added.tar" -C "$memo"
            (cd "$memo" && xargs -r touch -c <"$shard/used")
          done
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.formal-merge.outcome != '' && steps.formal-merge.outcome != 'skipped' }}
        with:
          path: ~/.cache/webspace-formal
          key: formal-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.formal-merge.outcome != '' && steps.formal-merge.outcome != 'skipped' }}
        with:
          name: formal-memo
          path: ~/.cache/webspace-formal
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore
  steps:
    name: Replay every step
    needs: [prepare, schedules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-formal
      - uses: actions/download-artifact@v4
        with:
          name: formal-model
          path: build/formal/model
      - uses: actions/download-artifact@v4
        with:
          name: formal-schedules
          path: build/formal/steps
      - id: replay-cache
        uses: actions/cache/restore@v4
        if: ${{ !inputs.cold }}
        with:
          path: ~/.cache/webspace-formal
          key: formal-replay-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: formal-replay-v1-${{ runner.os }}-
      - name: Restore from master's newest artifact when the cache is gone
        if: ${{ !inputs.cold && steps.replay-cache.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/restore_formal_artifact.sh "formal-replay-memo" "$HOME/.cache/webspace-formal"
      - id: formal-verify
        run: |
          if [ "${{ inputs.cold }}" = true ]; then rm -rf "$HOME/.cache/webspace-formal"; fi
          ./formal/verify.sh --stage steps
        timeout-minutes: 300
        env:
          FORMAL_RERUN: ${{ inputs.cold && '1' || '' }}
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.formal-verify.outcome != '' && steps.formal-verify.outcome != 'skipped' }}
        with:
          path: ~/.cache/webspace-formal
          key: formal-replay-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.formal-verify.outcome != '' && steps.formal-verify.outcome != 'skipped' }}
        with:
          name: formal-replay-memo
          path: ~/.cache/webspace-formal
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: formal-replay
          path: build/formal/steps.log
          if-no-files-found: error
  proofs:
    name: Prove every obligation
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tools
        uses: ./.github/actions/setup-formal
        with:
          proofs: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: formal-model
          path: build/formal/model
      - id: tlapm-cache
        uses: actions/cache/restore@v4
        if: ${{ !inputs.cold }}
        with:
          path: formal/proofs/.tlacache
          key: tlapm-${{ runner.os }}-${{ steps.tools.outputs.tlapm-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tlapm-${{ runner.os }}-${{ steps.tools.outputs.tlapm-version }}-
      - name: Restore from master's newest artifact when the cache is gone
        if: ${{ !inputs.cold && steps.tlapm-cache.outputs.cache-matched-key == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/restore_formal_artifact.sh "formal-tlacache-${{ steps.tools.outputs.tlapm-version }}" "formal/proofs/.tlacache"
      - id: formal-verify
        run: |
          if [ "${{ inputs.cold }}" = true ]; then rm -rf formal/proofs/.tlacache; fi
          ./formal/verify.sh --stage proofs
        timeout-minutes: 300
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.formal-verify.outcome != '' && steps.formal-verify.outcome != 'skipped' }}
        with:
          path: formal/proofs/.tlacache
          key: tlapm-${{ runner.os }}-${{ steps.tools.outputs.tlapm-version }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.formal-verify.outcome != '' && steps.formal-verify.outcome != 'skipped' }}
        with:
          name: formal-tlacache-${{ steps.tools.outputs.tlapm-version }}
          path: formal/proofs/.tlacache
          include-hidden-files: true
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: formal-proofs
          path: build/formal/proofs.log
          if-no-files-found: error
  finish:
    name: Verify complete coverage and floors
    needs: [prepare, models, steps, proofs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-formal
      - uses: actions/download-artifact@v4
        with:
          name: formal-model
          path: build/formal/model
      - uses: actions/download-artifact@v4
        with:
          pattern: formal-model-*
          path: build/formal/model-shards
      - uses: actions/download-artifact@v4
        with:
          name: formal-replay
          path: build/formal
      - uses: actions/download-artifact@v4
        with:
          name: formal-proofs
          path: build/formal
      - run: ./formal/verify.sh --stage finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-verification-report
          path: |
            build/formal/models.log
            build/formal/steps.log
            build/formal/proofs.log
            build/formal/levels.tsv
