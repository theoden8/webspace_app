name: Snap

# Builds the snap from snap/snapcraft.yaml for amd64 and arm64, each on a
# runner of its own architecture (an ubuntu-24.04 runner is the core24 host
# --destructive-mode needs), installs it and runs it with one site (scripts/check_snap.sh, PLATFORM-012). Nothing
# here logs in to the Snap Store or uploads: registering, uploading and
# releasing are the maintainer's, by hand (docs/releasing.md). Kept out of
# build-and-test.yml because a cold WPE WebKit build takes hours; ccache keeps
# its objects between runs. The same job makes the AppImage from what
# snapcraft primed (PLATFORM-013), packs it, and runs it with one site; the
# maintainer signs and publishes it (scripts/release_appimage.sh).

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # A release tag builds the snap its release carries. GitHub applies no
    # path filter to a tag push.
    tags:
      - 'v*'
    paths:
      - .github/workflows/snap.yml
      - tool/check_bundle_licences.js
      - test/js/helpers/licences.js
      - test/js/helpers/dart_blocks.js
      - test/js/helpers/source.js
      - openspec/specs/legal/**
      - snap/**
      - scripts/check_snap.sh
      - scripts/check_appimage.sh
      - tool/appimage_signature.js
      - tool/check_source_offer.js
      - linux/**
      - pubspec.lock
      - rust/webspace_adblock/**
  pull_request:
    paths:
      - .github/workflows/snap.yml
      - tool/check_bundle_licences.js
      - test/js/helpers/licences.js
      - test/js/helpers/dart_blocks.js
      - test/js/helpers/source.js
      - openspec/specs/legal/**
      - snap/**
      - scripts/check_snap.sh
      - scripts/check_appimage.sh
      - tool/appimage_signature.js
      - tool/check_source_offer.js
      - linux/**
      - pubspec.lock
      - rust/webspace_adblock/**

# A run in progress is left to finish: it fills the cache the queued run then
# builds from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snap:
    name: Build snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            appimage_arch: x86_64
            runner: ubuntu-24.04
            # amd64's caches were saved before they carried an architecture.
            fallback: snap-ccache-
          - arch: arm64
            appimage_arch: aarch64
            runner: ubuntu-24.04-arm
            fallback: snap-ccache-arm64-
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    # id-token and attestations: the build provenance of the AppDir a tag's
    # run keeps, which scripts/release_appimage.sh checks before it signs.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # WebKit's build tree does not fit beside the preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # The ccache directory is the one the wpewebkit part names; snapcraft
      # runs as root, the cache actions as the runner's user.
      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic
          sudo mkdir -p /var/cache/webspace-snap-ccache
          sudo chown "$USER" /var/cache/webspace-snap-ccache

      - name: Restore ccache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/webspace-snap-ccache
          key: snap-ccache-${{ matrix.arch }}-${{ hashFiles('snap/snapcraft.yaml') }}-${{ github.sha }}
          restore-keys: |
            snap-ccache-${{ matrix.arch }}-${{ hashFiles('snap/snapcraft.yaml') }}-
            snap-ccache-${{ matrix.arch }}-
            ${{ matrix.fallback }}

      - name: Build
        run: sudo snapcraft pack --destructive-mode

      # Saved even when a later part fails, so the next run starts from the
      # WPE objects this one compiled.
      - name: Hand the ccache back to the runner
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$USER" /var/cache/webspace-snap-ccache

      - name: Save ccache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/webspace-snap-ccache
          key: snap-ccache-${{ matrix.arch }}-${{ hashFiles('snap/snapcraft.yaml') }}-${{ github.sha }}

      # LICENSE-001 over what the snap carries, read from the snap itself:
      # every copyright file in it, and no GNU notice outside its notices.
      - name: Check the snap's licences
        run: |
          command -v unsquashfs >/dev/null || sudo apt-get install -y --no-install-recommends squashfs-tools
          unsquashfs -q -d snap-root ./*.snap
          node tool/check_bundle_licences.js snap-root
          sudo rm -rf snap-root

      # The runtimes' own store declarations let any snap's content plugs
      # connect to them, so even a snap installed from a file connects by
      # itself, as it does for a user; this checks that it did.
      - name: Install the snap
        run: |
          sudo snap install gnome-46-2404 mesa-2404 gtk-common-themes
          snap_name="$(sed -n 's/^name: \([a-z0-9-]*\)$/\1/p' snap/snapcraft.yaml)"
          sudo snap install --dangerous ./"$snap_name"_*_${{ matrix.arch }}.snap
          connections="$(snap connections "$snap_name")"
          echo "$connections"
          unconnected="$(awk '$1 == "content" && $3 == "-"' <<<"$connections")"
          if [ -n "$unconnected" ]; then
            echo "::error::a content plug of the snap is not connected: $unconnected" >&2
            exit 1
          fi

      # LICENSE-004: the source each bundled LGPL library's notices offer
      # (WebKit's, libwpe's) is a commit Software Heritage holds, so it can be
      # given whatever happens upstream.
      - name: Check the offered source is archived
        run: |
          snap_name="$(sed -n 's/^name: \([a-z0-9-]*\)$/\1/p' snap/snapcraft.yaml)"
          node tool/check_source_offer.js "/snap/$snap_name/current"

      # In the runner user's own session, as a desktop user runs it: lingering
      # starts the user's systemd and its bus, which snap run needs
      # (scripts/check_snap.sh says why).
      - name: Run the snap with a site
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libglib2.0-bin dbus-user-session
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 30); do
            [ -S "$XDG_RUNTIME_DIR/bus" ] && break
            sleep 1
          done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          bash scripts/check_snap.sh

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: webspace-snap-${{ matrix.arch }}
          path: '*.snap'
          if-no-files-found: error

      # PLATFORM-013: the AppImage's AppDir, from the snap's primed tree and
      # this Ubuntu 24.04 host's libraries.
      - name: Assemble the AppImage
        run: |
          [ -d prime ] || { echo "::error::snapcraft left no prime/ in the project directory" >&2; exit 1; }
          sudo apt-get install -y --no-install-recommends $(bash linux/appimage/build_appdir.sh packages)
          sudo bash linux/appimage/build_appdir.sh prime AppDir
          sudo chown -R "$USER" AppDir

      # LICENSE-001 over what the AppImage carries. Until no bundled package is
      # owed a reading, the AppDir is not kept and nothing can publish it.
      - name: Check the AppImage's licences
        id: appimage-licences
        run: |
          node tool/check_bundle_licences.js AppDir --owed linux/appimage/licences_owed.tsv
          if grep -qv '^#' linux/appimage/licences_owed.tsv; then
            echo "clear=false" >> "$GITHUB_OUTPUT"
          else
            echo "clear=true" >> "$GITHUB_OUTPUT"
          fi

      # Packed as the release packs it, signed by a key made for this run, so
      # the signature tool/appimage_signature.js checks is appimagetool's own.
      - name: Pack the AppImage
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'WebSpace CI, this run only' ed25519 sign 1d
          fpr="$(gpg --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          gpg --armor --export "$fpr" > "$RUNNER_TEMP/throwaway.asc"
          info="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|WebSpace-*-${{ matrix.appimage_arch }}.AppImage.zsync"
          bash linux/appimage/fetch_tools.sh "$RUNNER_TEMP/appimage-tools"
          bash linux/appimage/pack.sh --appdir AppDir --out "WebSpace-ci-${{ matrix.appimage_arch }}.AppImage" \
            --tools "$RUNNER_TEMP/appimage-tools" --key "$fpr" --update-info "$info"
          node tool/appimage_signature.js "WebSpace-ci-${{ matrix.appimage_arch }}.AppImage" \
            --key "$RUNNER_TEMP/throwaway.asc" --update-info "$info"
          ls -l WebSpace-ci-*

      - name: Run the AppImage with a site
        run: |
          sudo apt-get install -y --no-install-recommends fuse3 xvfb libglib2.0-bin dbus
          bash scripts/check_appimage.sh AppDir "WebSpace-ci-${{ matrix.appimage_arch }}.AppImage"

      - name: Keep the AppDir for the release
        if: steps.appimage-licences.outputs.clear == 'true'
        run: |
          tar -C AppDir --sort=name --numeric-owner --owner=0 --group=0 -cf - . \
            | zstd -19 -T0 -o "webspace-appdir-${{ matrix.arch }}.tar.zst"

      - name: Attest the AppDir's provenance
        if: steps.appimage-licences.outputs.clear == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: webspace-appdir-${{ matrix.arch }}.tar.zst

      - name: Upload the AppDir
        if: steps.appimage-licences.outputs.clear == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webspace-appdir-${{ matrix.arch }}
          path: webspace-appdir-${{ matrix.arch }}.tar.zst
          if-no-files-found: error
