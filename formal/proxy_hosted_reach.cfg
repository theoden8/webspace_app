\* Anti-vacuity (LIR-018): a hosted slot co-loads with its host's own slot
\* under serialisation. Expect: Reach_HostedCoLoaded VIOLATED.
CONSTANTS
    N = 3
    Proxies = {"direct", "socks"}
    proxyOf <- ProxyOfDef
    Router = "off"
    Conflict = "none"
SPECIFICATION Spec
INVARIANTS
    Reach_HostedCoLoaded
