\* Non-mix: the router attributes one site's connection to another site's
\* credential -- what a shared Chromium HttpAuthCache across container
\* profiles would produce. Expect: Inv_EgressMatchesConfig VIOLATED.
CONSTANTS
    N = 3
    Proxies = {"direct", "socks"}
    proxyOf <- ProxyOfDef
    Router = "on"
    Conflict = "misattribute"
SPECIFICATION Spec
INVARIANTS
    Inv_EgressMatchesConfig
