\* One certificate, and one without its bytes, met on two host:ports: every
\* invariant holds, a decline standing for every host (TLS-013).
CONSTANTS
    Views = {"v1"}
    Hosts = {"h1", "h2"}
    Certs = {"a"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 0
    MaxRevokes = 0
    Mistake = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    Inv_PinAccepted
    Inv_PassPinned
    Inv_LateAnswer
    Inv_NoAskInPortal
    Inv_NoWebPinPassInPortal
    Inv_DeclinedNotAsked
    Inv_NoPinInPortal
    Inv_OneAtATime
