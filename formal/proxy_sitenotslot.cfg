\* Non-mix (LIR-024): activation serialises by the sites' own proxies instead
\* of what their slots run as. Expect: Inv_EgressMatchesConfig VIOLATED.
CONSTANTS
    N = 3
    Proxies = {"direct", "socks"}
    proxyOf <- ProxyOfDef
    Router = "off"
    Conflict = "sitenotslot"
SPECIFICATION Spec
INVARIANTS
    Inv_EgressMatchesConfig
