\* Mistake "answerunread": the verdict is read once, before the prompt, so an
\* Accept that lands after the OS starts reporting a portal pins the portal's
\* certificate and proceeds: caught (TLS-012).
CONSTANTS
    Views = {"v1", "v2"}
    Hosts = {"h1"}
    Certs = {"a", "b"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 1
    MaxRevokes = 1
    Mistake = "answerunread"
SPECIFICATION Spec
INVARIANTS
    Inv_NoPinInPortal
