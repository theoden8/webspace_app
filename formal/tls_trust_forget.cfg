\* Mistake "forget": a decline is not remembered, so the certificate is asked
\* about again: caught (TLS-013).
CONSTANTS
    Views = {"v1"}
    Hosts = {"h1", "h2"}
    Certs = {"a"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 0
    MaxRevokes = 0
    Mistake = "forget"
SPECIFICATION Spec
INVARIANTS
    Inv_DeclinedNotAsked
