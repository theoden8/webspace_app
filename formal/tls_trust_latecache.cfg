\* Mistake "latecache": an answer landing after its view went away pins the
\* certificate another view's handshake cached for the host since: caught.
CONSTANTS
    Views = {"v1", "v2"}
    Hosts = {"h1"}
    Certs = {"a", "b"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 1
    MaxRevokes = 1
    Mistake = "latecache"
SPECIFICATION Spec
INVARIANTS
    Inv_LateAnswer
