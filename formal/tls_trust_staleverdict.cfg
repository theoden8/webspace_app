\* Mistake "staleverdict": the verdict the OS gave as the handshake arrived
\* stands in for the one it gives at the read, so a prompt opens while the OS
\* reports a portal: caught (TLS-012).
CONSTANTS
    Views = {"v1", "v2"}
    Hosts = {"h1"}
    Certs = {"a", "b"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 1
    MaxRevokes = 1
    Mistake = "staleverdict"
SPECIFICATION Spec
INVARIANTS
    Inv_NoAskInPortal
