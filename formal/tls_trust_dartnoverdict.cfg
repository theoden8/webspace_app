\* Mistake "dartnoverdict": a Dart client honours a pin without the last
\* verdict, so it trusts a portal's certificate the OS reported: caught
\* (TLS-012, SEC-055).
CONSTANTS
    Views = {"v1", "v2"}
    Hosts = {"h1"}
    Certs = {"a", "b"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 1
    MaxRevokes = 1
    Mistake = "dartnoverdict"
SPECIFICATION Spec
INVARIANTS
    Inv_NoDartPinOnPortal
