\* Router mode (PROXY-013), good: each loaded site egresses through its own
\* configured proxy even though they differ. Expect: all invariants hold.
CONSTANTS
    N = 3
    Proxies = {"direct", "socks"}
    proxyOf <- ProxyOfDef
    Router = "on"
    Conflict = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    Inv_EgressMatchesConfig
    Inv_ActiveLoaded
