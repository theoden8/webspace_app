\* A known limit, not in check.sh: a Dart client goes by the last verdict a
\* webview read (NetworkSignIn.portalReported), so a portal the OS starts
\* reporting after that read lets one pinned request through until the next
\* read. TLC's counterexample is that window; TLS-012 names it.
CONSTANTS
    Views = {"v1", "v2"}
    Hosts = {"h1"}
    Certs = {"a", "b"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 1
    MaxRevokes = 1
    Mistake = "none"
SPECIFICATION Spec
INVARIANTS
    Gap_NoPinPassInPortal
