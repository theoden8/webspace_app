\* Mistake "sharedcache": one certificate cache for every view of a host,
\* written by any trust callback, so a load error asks about, and on Accept
\* pins, another view's certificate: caught (SEC-054).
CONSTANTS
    Views = {"v1", "v2"}
    Hosts = {"h1"}
    Certs = {"a", "b"}
    NoDer = {}
    None = "none"
    Entries = {"trust", "error"}
    MaxChallenges = 3
    MaxDart = 0
    MaxRevokes = 0
    Mistake = "sharedcache"
SPECIFICATION Spec
INVARIANTS
    Inv_ShownOwn
