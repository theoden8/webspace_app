\* Mistake "noportal": the OS's portal verdict is not read, so a pin lets a
\* certificate through while the OS reports a portal: caught (TLS-012).
CONSTANTS
    Views = {"v1", "v2"}
    Hosts = {"h1"}
    Certs = {"a", "b"}
    NoDer = {"n"}
    None = "none"
    Entries = {"trust", "bare", "error"}
    MaxChallenges = 2
    MaxDart = 1
    MaxRevokes = 1
    Mistake = "noportal"
SPECIFICATION Spec
INVARIANTS
    Inv_NoWebPinPassInPortal
