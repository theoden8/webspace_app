\* The other side of the same formula: under PROXY-008 serialisation two
\* mismatched sites must NEVER co-load. Expect: all invariants hold.
CONSTANTS
    N = 3
    Proxies = {"direct", "socks"}
    proxyOf <- ProxyOfDef
    Router = "off"
    Conflict = "none"
SPECIFICATION Spec
INVARIANTS
    Inv_EgressMatchesConfig
    Reach_MismatchedCoLoaded
