name: webspace
description: WebSpace is a mobile app that brings all your favorite websites and web apps together in one organized, streamlined interface.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.3.4+29

environment:
  sdk: '3.12.2'
  flutter: '3.44.9'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  ffi: ^2.1.0
  shared_preferences: ^2.1.0
  http: ^1.2.2
  crypto: ^3.0.0
  meta: ^1.16.0
  cryptography: ^2.7.0
  socks5_proxy: ^2.1.1
  cached_network_image: ^3.4.1
  # Used only by the web half of the favicon renderer (favicon_image_web.dart).
  web: ^1.1.0
  flutter_svg: ^2.0.10+1
  html: ^0.15.4

  # Webview packages
  # Android/mobile: flutter_inappwebview (stable, feature-rich)
  flutter_inappwebview: ^6.1.0+1

  url_launcher: ^6.1.10
  uuid: ^4.5.1
  image: ^4.3.0  # Required by third_party/favicon
  file_picker: ^11.0.2
  flutter_secure_storage: ^10.0.0
  package_info_plus: ^9.0.1
  flutter_cache_manager: ^3.3.0
  path_provider: ^2.1.0
  encrypt: ^5.0.3
  # Named for the exception a failed GCM tag check throws; encrypt's own
  # engine, already locked through it.
  pointycastle: ^3.9.1
  share_plus: ^12.0.0
  qr_flutter: ^4.1.0
  flutter_zxing: ^2.2.1
  flutter_local_notifications: ^21.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  # Used to unzip the downloaded timezone-boundary-builder GeoJSON release.
  # Already a transitive dependency of other packages; promoted to direct
  # so it has a stable version constraint we control.
  archive: ^4.0.0
  # Parses the OpenSearch descriptions sites declare (LIR-035). Already a
  # transitive dependency; promoted to direct for the same reason as archive.
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Deterministic event-loop control for interleaving tests (already locked
  # transitively via flutter_test); declared direct for the surface-repaint
  # nudge-loop race test.
  fake_async: ^1.3.3
  # The https arms of the proxy tiers mint their own certificate (with
  # pointycastle, a main dependency): the macOS integration tier runs an app
  # bundle, where no `openssl` binary is on PATH. Already locked transitively.
  asn1lib: ^1.6.5
  # test/helpers/real_app.dart registers the Android webview platform to pump
  # the shipped app; the fork's ref is pinned by the overrides below.
  flutter_inappwebview_android: any
  # test/named_arguments_test.dart parses every Dart source to hold CLAUDE.md
  # rule 2 (named arguments past the first).
  analyzer: ^10.0.1

# Per-site container isolation requires APIs not present in upstream
# flutter_inappwebview. We maintain a fork that adds a first-class
# "containers" API (per-site Android Profile / WKWebsiteDataStore
# binding + per-site iOS/macOS proxy). The overrides below pull the
# fork's monorepo by git ref and point each plugin at its subdirectory.
#
# Pinned to an immutable fork tag so CI builds don't drift.
#
# Spec: openspec/specs/per-site-containers/spec.md
dependency_overrides:
  flutter_inappwebview:
    git:
      url: https://github.com/theoden8/flutter_inappwebview
      ref: v6.2.0-beta.3-privacy-v12
      path: flutter_inappwebview
  flutter_inappwebview_android:
    git:
      url: https://github.com/theoden8/flutter_inappwebview
      ref: v6.2.0-beta.3-privacy-v12
      path: flutter_inappwebview_android
  flutter_inappwebview_ios:
    git:
      url: https://github.com/theoden8/flutter_inappwebview
      ref: v6.2.0-beta.3-privacy-v12
      path: flutter_inappwebview_ios
  flutter_inappwebview_macos:
    git:
      url: https://github.com/theoden8/flutter_inappwebview
      ref: v6.2.0-beta.3-privacy-v12
      path: flutter_inappwebview_macos
  flutter_inappwebview_linux:
    git:
      url: https://github.com/theoden8/flutter_inappwebview
      ref: v6.2.0-beta.3-privacy-v12
      path: flutter_inappwebview_linux
  flutter_inappwebview_platform_interface:
    git:
      url: https://github.com/theoden8/flutter_inappwebview
      ref: v6.2.0-beta.3-privacy-v12
      path: flutter_inappwebview_platform_interface

flutter:
  uses-material-design: true
  generate: true
  # Stable turned SwiftPM on by default in 3.44. The Podfiles carry build logic
  # (the adblock Rust phase, the Tor pod) SwiftPM does not run, and SwiftPM
  # builds each plugin at its own deployment target, below the app's floor.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/LICENSE
    - assets/licenses/
    - assets/webspace_icon.png
    - assets/webspace_icon_dark.png
    - lib/js/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/webspace_icon.png"  # 1024x1024 PNG recommended
  remove_alpha_ios: true
  image_path: "assets/webspace_icon.png"  # Path to your icon.png
  image_path_ios_dark_transparent: "assets/webspace_icon_dark.png"
  adaptive_icon_background: "#FFFFFF"  # Optional Android background
  adaptive_icon_foreground: "assets/webspace_icon.png"
  adaptive_icon_monochrome: "assets/webspace_icon_monochrome.png"
