[package]
name = "webspace_adblock"
version = "0.1.0"
edition = "2021"
description = "C FFI surface around the `adblock` crate (Brave's adblock-rust engine), tailored for WebSpace's content blocker."
license = "MPL-2.0"
publish = false

[lib]
name = "webspace_adblock"
# `cdylib` for Android (.so) and Linux (.so).
# `staticlib` for iOS / macOS (XCFramework + dylib).
# Both produced from one build.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# IMPORTANT: `default-features = false` is load-bearing. The crate's
# default features include `single-thread`, which trades Send + Sync
# on `Engine` for slightly better single-threaded perf. We need
# Send + Sync because JNI hands the engine handle to the chromium IO
# thread on every `shouldInterceptRequest` call — different thread
# than the one that built the engine. Without disabling defaults,
# `nativeCheckUrl` would race; with defaults disabled, all reads on
# the engine are safe across threads (we never take `&mut`).
adblock = { version = "0.13.3", default-features = false, features = [
  "embedded-domain-resolver",
  "full-regex-handling",
  # WebKit content rule lists (`ws_filters_to_content_rule_lists`) for
  # the experimental native blocking on iOS/macOS, content-blocker spec
  # CB-020. WebKit reports no rule match back, so blocking stats stay
  # with the page's interceptor.
  "content-blocking",
  # uBO resource format parsers. Exposes `lists::ResourceAssembler`
  # and the runtime side of `engine.use_resources(...)` — required
  # for $redirect= rule serving (noop.js, etc.) and #$# snippet
  # injection. Enabling the parser is zero-cost; activating those
  # rule shapes also requires bundling uBO's resources directory
  # and wiring redirect serving in the native interceptor +
  # injected_script in the cosmetic shim. Currently only the
  # parser side is on; the resource pool is empty so $redirect=
  # rules silently become drop-the-request and #$# becomes a
  # no-op. Same observable behaviour as before the feature flag.
  "resource-assembler",
  # Pulls in `cssparser` + `selectors` so the crate validates the CSS
  # half of procedural rules at parse time instead of silently
  # dropping them. Without this flag adblock-rust 0.13 fails to
  # recognise `:has-text()`, `:upward()`, `:remove()`, `:style()` on
  # class/id-anchored generic selectors — see
  # https://github.com/brave/adblock-rust/issues/537 and the
  # follow-up PR https://github.com/brave/adblock-rust/pull/609
  # which proposes making this default-on for exactly that reason.
  # Adds ~70 kB to the static lib for the parsers.
  "css-validation",
] }
serde_json = "1"

# Build-time only: we use the adblock crate's resource_assembler to
# parse a downloaded uBO tarball into a serializable Vec<Resource>,
# then embed the result via include_str!. The runtime engine
# dependency above does NOT enable resource-assembler (no need at
# runtime — we already have the JSON baked in).
[build-dependencies]
adblock = { version = "0.13.3", default-features = false, features = [
  "embedded-domain-resolver",
  "resource-assembler",
] }
serde_json = "1"
# SPDX 3.x license dataset. `License::text()` returns the canonical
# upstream-published text — sourced from the SPDX license-list-data
# repo, vendored in this crate. Used by build.rs to attach the
# real license body to each transitive dep's metadata entry. Avoids
# the legal risk of either hand-typing the texts (typo / drift) or
# scraping non-standard LICENSE filenames out of every crate's
# source tree.
license = "3"

# Android-only: JNI exports so Kotlin's FastSubresourceInterceptor can
# consult the engine on every sub-resource without a Dart roundtrip.
# The `jni` crate is excluded from non-Android builds — it pulls in
# JVM-specific glue that's pointless on iOS/macOS/Linux/Windows.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
